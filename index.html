<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- We need this tag to properly display our pages at mobile size/make it responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="css/main.css" rel="stylesheet">
    <title>Human Anatomy Puzzle Game</title>
</head>
<body>
    <header class="centered">
        <h1 id="title">Human Anatomy Quiz</h1> 
        <p id="inst">Drag the labels to the correct organs</p> 
    </header>

    <section id="game" class="centered">
        <h2 class="hidden">Quiz Area</h2>
        <div id="diagram">
            <img src="images/body.png" alt="A diagram of the human body with organs to be named">
            <div id="heart"></div>
            <div id="lung"></div>
            <div id="liver"></div>
            <div id="stomach"></div>
            <div id="intestines"></div>
        </div>
        <section id="label-con" class="centered">
            <h3>Labels</h3>
            <button id="reset-btn" class="small-btn">Reset</button>             

            <div id="labels">
                <div draggable="true" class="label-title">Heart</div>
                <div draggable="true" class="label-title">Lung</div>
                <div draggable="true" class="label-title">Liver</div>
                <div draggable="true" class="label-title">Stomach</div>
                <div draggable="true" class="label-title">Intestines</div>
            </div>

             <button id="submit-btn" class="hidden">Submit</button>   
        </section>
    </section>
    
    
    <script src="js/main.js"></script>
</body>
</html>
